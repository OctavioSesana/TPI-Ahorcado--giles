name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permite que el job de deploy publique en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

jobs:
  # 1) Build + 2) Unit tests con coverage + 3) Acceptance tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run acceptance tests
        run: npm run at

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # 4) Análisis estático (CodeQL) con quality gate propio:
  # si encuentra hallazgos de severidad error/warning, falla el workflow.
  static-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: sarif-results
          upload: true

      - name: Quality gate - fail on findings
        run: |
          echo "Archivos SARIF generados:"
          ls -la sarif-results/
          COUNT=$(jq -s '[.[].runs[].results[] | select(.level=="error" or .level=="warning")] | length' sarif-results/*.sarif)
          echo "Hallazgos de CodeQL (error/warning): $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::CodeQL encontró $COUNT hallazgo(s) de severidad error/warning. Quality gate falló."
            exit 1
          fi

  # 5) Deploy a GitHub Pages (solo cuando se pushea a main y todo lo anterior pasó)
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, static-analysis]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4